#
# WINDOW RULES
#

layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  blur_popups = on
  match:namespace = waybar
}



## swaync
layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  animation = popin 95%
  match:namespace = swaync-control-center
}


layerrule {
  name = layerrule-3
  blur = on
  ignore_alpha = 0
  animation = slide
  match:namespace = swaync-notification-window
}


## rofi

layerrule {
  name = layerrule-4
  blur = on
  ignore_alpha = 0
  animation = popin 95%
  match:namespace = rofi
}



windowrule {
  name = windowrule-1
  workspace = 2
  match:class = Thorium-browser
}

windowrule {
  name = windowrule-2
