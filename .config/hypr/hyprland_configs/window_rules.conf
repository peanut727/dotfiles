windowrule {
  name = windowrule-25
  float = on
  match:title = ^(Media viewer)$
}

windowrule {
  name = windowrule-26
  float = on
  size = 800 600
  move = (75) ((monitor_h*0.44))
  match:title = ^(Volume Control)$
}

windowrule {
  name = windowrule-27
  float = on
  match:title = ^(Picture-in-Picture)$
}

#windowrulev2 = opacity 0.1 override 0.85 override, title:^(kitty)$

windowrule {
  name = windowrule-28
  opacity = 0.8
  match:initial_title = (Spotify Free)
}

windowrule {
  name = windowrule-29
  workspace = 4
  match:initial_class = (.*)(.exe)
}






