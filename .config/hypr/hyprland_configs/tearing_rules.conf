#
# TEARING WINDOW RULES
#


windowrule {
  name = windowrule-1
  immediate = on
  match:class = ^(java)$ # Minecraft
}

windowrule {
  name = windowrule-2
  immediate = on
  match:class = ^(sober)$
}

windowrule {
  name = windowrule-3
  immediate = on
  match:class = ^(gamescope)$
}

windowrule {
  name = windowrule-4
  immediate = on
  match:class = ^(corekeeper.exe)$
}

windowrule {
  name = windowrule-5
  immediate = on
  match:class = ^(Muck.x86_64)$
}

windowrule {
  name = windowrule-6
  immediate = on
  match:class = ^(osu!)$
}

windowrule {
  name = windowrule-7
  immediate = on
  match:fullscreen = 1
}

#windowrulev2  = workspace 4, class:^(.*\.exe)$ # Should automatically handle all .exe processes
